[project]
name = "flash-dit"
version = "0.1.0"
description = "Optimized audio Diffusion Transformer with Muon, GQA, FA2/3, and torch.compile"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "setuptools>=68,<80",
    "hydra-core>=1.3",
    "lightning>=2.4",
    "einops>=0.8",
    "rich>=13.0",
    "h5py>=3.10",
    "tqdm>=4.66",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "omegaconf>=2.3",
    "frechet-audio-distance>=0.0.6",
    "laion-clap",
    "stable-audio-tools",
    "pandas>=2.0",
    "wandb",
    "nvitop>=1.6.2",
    "audiobox-aesthetics>=0.0.4",
]

[project.optional-dependencies]
# Install on CINECA/H100 only — requires CUDA + nvcc available:
#   module load cuda/12.2 && uv add flash-attn --no-build-isolation  (A100)
#   pip install <prebuilt-fa3-wheel>                                  (H100)
flash = ["flash-attn>=2.8.3"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
# Prebuilt FA2 wheel for torch 2.5 / cu12 / py311 / cxx11abi=FALSE.
# Avoids the local-build path that needs nvcc + CUDA_HOME, which are not
# available in most lightweight dev shells.
# Primary (remote): github release for flash-attn 2.8.3.
# Fallback (local): /tmp/fa_wheel/flash_attn.whl — downloaded once when
# the github download flakes (connection resets on the 245 MB asset).
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
