[project]
name = "flash-dit"
version = "0.1.0"
description = "Optimized audio Diffusion Transformer with Muon, GQA, FA2/3, and torch.compile"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "setuptools>=68,<80",
    "flash-attn>=2.8.3",
    "hydra-core>=1.3",
    "lightning>=2.4",
    "einops>=0.8",
    "rich>=13.0",
    "h5py>=3.10",
    "tqdm>=4.66",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "omegaconf>=2.3",
    "frechet-audio-distance>=0.0.6",
    "laion-clap",
    "stable-audio-tools",
    "pandas>=2.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
stable-audio-tools = { path = "../stable-audio-tools", editable = true }

[tool.uv.extra-build-dependencies]
flash-attn = ["setuptools"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
