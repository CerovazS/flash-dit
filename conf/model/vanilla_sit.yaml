_target_: flash_dit.models.dit.DiffusionTransformer
name: vanilla_sit
# Architecture — same parameter count as flash_dit for fair comparison
in_channels: 64
d_model: 768
n_layers: 12
n_heads: 12
n_kv_heads: 12       # = n_heads → standard MHA, no KV compression
mlp_mult: 2.667      # 8/3 — SwiGLU standard
n_classes: 16
cfg_dropout: 0.1
# Optimizations disabled
attention_type: mha
mlp_type: swiglu
use_fa3: false
use_compile: false
dropout: 0.0
max_seq_len: 256
