_target_: flash_dit.models.dit.DiffusionTransformer
name: flash_dit_recurse
# Architecture with depth recurrence: 4 unique blocks × 3 loops = 12 passes
in_channels: 64
d_model: 768
n_layers: 12
n_unique_layers: 4   # unique block count; n_layers must be divisible by this
n_heads: 12
n_kv_heads: 2        # GQA
mlp_mult: 2.667
n_classes: 16
cfg_dropout: 0.1
# Optimizations
attention_type: gqa
mlp_type: swiglu
use_fa3: false
use_compile: true
dropout: 0.0
max_seq_len: 256
