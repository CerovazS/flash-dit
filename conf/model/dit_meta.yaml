# DiT-faithful: LayerNorm-no-affine, GELU-tanh ×4, fixed 1D sin-cos abs pos
# embedding, AdaLN-Zero gated, qkv_bias=True. Deliberately deviates from
# upstream Meta DiT on 3 axes:
#   - rectified flow (single-C output, no learn_sigma)
#   - patch_size=1 (no PatchEmbed; we operate on 1D audio latents)
#   - 1D sin-cos pos embed instead of 2D
# All other architectural identity preserved.
_target_: flash_dit.models.dit.DiffusionTransformer
name: dit_meta
in_channels: 64
d_model: 768
n_layers: 12
n_heads: 12
n_kv_heads: 12          # MHA, no GQA — fair comparison vs vanilla_sit
mlp_mult: 4.0           # DiT paper default (mlp_ratio=4)
n_classes: 17
cfg_dropout: 0.1
attention_type: mha
mlp_type: gelu          # GELU(approximate="tanh"), bias=True, no dropout
norm_type: layernorm_no_affine   # nn.LayerNorm(elementwise_affine=False, eps=1e-6)
pos_embed_type: sincos_abs       # fixed 1D sin-cos, frozen
qkv_bias: true                   # matches DiT models.py:108
use_fa3: false
use_compile: false
dropout: 0.0
max_seq_len: 256
