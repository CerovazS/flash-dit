_target_: flash_dit.models.dit.DiffusionTransformer
name: flash_dit
# Architecture
in_channels: 64
d_model: 768
n_layers: 12
n_heads: 12
n_kv_heads: 2        # GQA: 6:1 query-to-KV ratio
mlp_mult: 2.667      # 8/3 SwiGLU
n_classes: 17
cfg_dropout: 0.1
# Optimizations enabled
attention_type: gqa
mlp_type: swiglu
use_fa3: false       # set true only on H100 (RunPod pod)
use_compile: true    # torch.compile with reduce-overhead mode
dropout: 0.0
max_seq_len: 256
